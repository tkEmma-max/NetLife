name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  flutter_svg: ^2.3.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  geocoding: ^4.0.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/iconNew.png"